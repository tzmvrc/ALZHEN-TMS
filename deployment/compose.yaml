name: alzhen
x-logging: &bounded-logs
  driver: local
  options:
    max-size: "10m"
    max-file: "3"
services:
  proxy:
    image: alzhen-proxy:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/Dockerfile.proxy
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL}
      CADDY_LOG_LEVEL: INFO
    ports: ["80:80", "443:443"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
      - proxy_logs:/var/log/caddy
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    networks: [edge, app]
    depends_on:
      backend: {condition: service_healthy}
      frontend: {condition: service_healthy}
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    cpus: 0.15
    pids_limit: 64
    logging: *bounded-logs
  frontend:
    image: alzhen-frontend:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/Dockerfile.frontend
      args:
        VITE_API_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}/api
        VITE_SOCKET_URL: https://${APP_DOMAIN:?Set APP_DOMAIN}
        VITE_SUPABASE_URL: ${PUBLIC_SUPABASE_URL:?Set PUBLIC_SUPABASE_URL}
        VITE_SUPABASE_ANON_KEY: ${PUBLIC_SUPABASE_ANON_KEY:?Set PUBLIC_SUPABASE_ANON_KEY}
        VITE_MAPBOX_ACCESS_TOKEN: ${PUBLIC_MAPBOX_TOKEN:-}
    networks: [app]
    restart: unless-stopped
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777,noexec,nosuid,nodev", "/config:size=8m,uid=1000,gid=1000,noexec,nosuid,nodev", "/data:size=8m,uid=1000,gid=1000,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    cpus: 0.10
    pids_limit: 64
    logging: *bounded-logs
  backend:
    image: alzhen-backend:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      target: backend
    env_file: ./secrets/backend.env
    environment:
      NODE_ENV: production
      PORT: "5000"
      CORS_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      SOCKET_ORIGINS: https://${APP_DOMAIN:?Set APP_DOMAIN}
      TRUST_PROXY_HOPS: "1"
      WEB_CONCURRENCY: "1"
      PDF_WORKER_SOCKET: /run/pdf/renderer.sock
      PDF_WORKER_PROCESS: "false"
      TRACKING_ENABLED: ${TRACKING_ENABLED:-false}
      POD_PDF_ENABLED: ${POD_PDF_ENABLED:-false}
      POD_REVIEW_ENABLED: "true"
    volumes: ["pdf_socket:/run/pdf:ro"]
    networks: [app, outbound]
    depends_on:
      pdf-worker: {condition: service_healthy}
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    read_only: true
    tmpfs: ["/tmp:size=64m,mode=1777,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 0.75
    pids_limit: 128
    logging: *bounded-logs
  pdf-worker:
    image: alzhen-pdf-worker:${RELEASE_TAG:-local}
    build:
      context: ..
      dockerfile: deployment/Dockerfile.backend
      target: pdf-worker
    # Deliberately NO env_file, secrets, TCP ports, application mounts or network.
    network_mode: none
    volumes: ["pdf_socket:/run/pdf"]
    restart: unless-stopped
    init: true
    stop_grace_period: 25s
    read_only: true
    tmpfs: ["/tmp:size=96m,mode=1777,noexec,nosuid,nodev"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 1536m
    cpus: 1.0
    pids_limit: 64
    logging: *bounded-logs
networks:
  edge: {}
  app: {internal: true}
  outbound: {}
volumes:
  caddy_data: {}
  caddy_config: {}
  proxy_logs: {}
  pdf_socket: {}
